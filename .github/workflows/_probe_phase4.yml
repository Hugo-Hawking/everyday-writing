# 一次性探针（phase4 诊断，用完即删）：测定 GITHUB_TOKEN 对 Discussion 评论的 update/delete 能力。
name: _probe_phase4
on:
  workflow_dispatch:
permissions:
  contents: read
  discussions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/bot/_probe_discussion_comment_caps.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
